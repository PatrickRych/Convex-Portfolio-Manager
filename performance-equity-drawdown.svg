<title id="t">2026 equity and drawdown diagnostics</title>
<desc id="d">Reported performance review diagnostics: net realized P and L 6,220 dollars, return on reference capital 39.9 percent, maximum drawdown negative 21.7 percent versus SPY negative 9.1 percent. The source review states the equity curve rose strongly into August and then experienced a sharp clustered drawdown that remained unrecovered at the review date.</desc>
